<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mines - Multiplayer</title>
<style>
    :root {
        --bg-color: #0f172a; --card-color: #1e293b; --accent-color: #10b981;
        --accent-hover: #059669; --danger-color: #ef4444; --text-color: #f8fafc;
        --text-muted: #94a3b8; --tile-bg: #334155; --tile-hover: #475569; --gem-color: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background-color: rgba(15,23,42,0.95); display:flex; justify-content:center; align-items:center; z-index:1000; }
    .modal-content { background-color: var(--card-color); padding:40px; border-radius:16px; width:90%; max-width:400px; text-align:center; box-shadow:0 10px 25px rgba(0,0,0,0.5); }
    .modal-content h2 { margin-bottom:8px; color: var(--accent-color); }
    .modal-sub { color: var(--text-muted); font-size:0.85rem; margin-bottom:20px; }
    .tabs { display:flex; margin-bottom:20px; border-radius:8px; overflow:hidden; border:1px solid var(--tile-bg); }
    .tab-btn { flex:1; padding:10px; background:var(--bg-color); color:var(--text-muted); border:none; cursor:pointer; font-weight:bold; }
    .tab-btn.active { background:var(--accent-color); color:white; }
    .modal-content input { width:100%; padding:14px; margin-bottom:14px; border-radius:8px; border:1px solid var(--tile-bg); background-color:var(--bg-color); color:white; font-size:1rem; text-align:center; outline:none; }
    .modal-content input:focus { border-color: var(--accent-color); }
    .error-msg { color: var(--danger-color); font-size:0.85rem; min-height:20px; margin-bottom:10px; }
    .hidden { display:none !important; }

    .container { display:flex; flex-direction:column; gap:20px; width:100%; max-width:900px; }
    .header { background-color: var(--card-color); padding:20px; border-radius:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
    .balance-box { display:flex; flex-direction:column; }
    .balance-title { font-size:0.875rem; color: var(--text-muted); }
    .balance-amount { font-size:1.5rem; font-weight:bold; color: var(--accent-color); }
    .user-panel { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .user-name { font-weight:bold; color: var(--gem-color); }
    .btn-logout { background:transparent; border:1px solid var(--text-muted); color:var(--text-muted); padding:8px 12px; border-radius:6px; cursor:pointer; font-size:0.85rem; }
    .btn-logout:hover { border-color: var(--text-color); color: var(--text-color); }

    .main-layout { display:flex; gap:20px; flex-direction:column; }
    @media (min-width:768px) { .main-layout { flex-direction:row; } }

    .leaderboard { background-color: var(--card-color); padding:20px; border-radius:12px; flex:1; min-width:200px; display:flex; flex-direction:column; }
    .leaderboard h3 { color: var(--gem-color); margin-bottom:15px; font-size:1.1rem; text-align:center; }
    .rank-list { list-style:none; display:flex; flex-direction:column; gap:10px; overflow-y:auto; max-height:400px; }
    .rank-item { display:flex; justify-content:space-between; background:var(--bg-color); padding:10px; border-radius:8px; font-size:0.9rem; }
    .rank-item.me { border:1px solid var(--accent-color); font-weight:bold; }
    .rank-name { color: var(--text-color); }
    .rank-money { color: var(--accent-color); }

    .game-area { display:flex; flex-direction:column; gap:20px; flex:2.5; }
    .controls { background-color: var(--card-color); padding:20px; border-radius:12px; display:flex; gap:16px; flex-wrap:wrap; }
    .input-group { display:flex; flex-direction:column; gap:8px; flex:1; min-width:120px; }
    .input-group label { font-size:0.875rem; color: var(--text-muted); }
    .input-group input, .input-group select { background-color: var(--bg-color); border:1px solid var(--tile-bg); color: var(--text-color); padding:12px; border-radius:8px; outline:none; }

    .btn-main { background-color: var(--accent-color); color:white; border:none; padding:14px; border-radius:8px; font-size:1rem; font-weight:bold; cursor:pointer; flex:1; min-width:100px; margin-top:auto; }
    .btn-main:hover:not(:disabled) { background-color: var(--accent-hover); }
    .btn-main:disabled { opacity:0.5; cursor:not-allowed; }

    .board-container { background-color: var(--card-color); padding:20px; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; width:100%; max-width:350px; aspect-ratio:1; }
    .tile { background-color: var(--tile-bg); border-radius:8px; display:flex; justify-content:center; align-items:center; font-size:1.5rem; cursor:pointer; user-select:none; transition:all 0.2s; }
    .tile:hover:not(.revealed) { background-color: var(--tile-hover); transform:translateY(-2px); }
    .tile.revealed { cursor:default; }
    .tile.gem { background-color: rgba(56,189,248,0.2); border:2px solid var(--gem-color); }
    .tile.mine { background-color: rgba(239,68,68,0.2); border:2px solid var(--danger-color); }

    .status-box { margin-bottom:15px; text-align:center; height:48px; display:flex; flex-direction:column; justify-content:center; }
    .multiplier { font-size:1.25rem; font-weight:bold; color: var(--accent-color); }
    .next-multiplier { font-size:0.8rem; color: var(--text-muted); }
    .message.win { color: var(--accent-color); font-weight:bold; }
    .message.lose { color: var(--danger-color); font-weight:bold; }
</style>
</head>
<body>

<div id="authModal" class="modal-overlay">
    <div class="modal-content">
        <h2>🎰 Mines</h2>
        <p class="modal-sub">가상 게임머니로 즐기는 마인즈 게임<br>(실제 돈과 무관합니다)</p>
        <div class="tabs">
            <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">로그인</button>
            <button class="tab-btn" id="tabSignup" onclick="switchTab('signup')">회원가입</button>
        </div>
        <input type="text" id="authUsername" placeholder="아이디 (영문/숫자 3~15자)" autocomplete="username">
        <input type="password" id="authPassword" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" onkeypress="if(event.key==='Enter') handleAuthSubmit()">
        <div class="error-msg" id="authError"></div>
        <button class="btn-main" style="width:100%;" id="authSubmitBtn" onclick="handleAuthSubmit()">로그인</button>
    </div>
</div>

<div class="container" id="gameContainer" style="display:none;">
    <div class="header">
        <div class="balance-box">
            <span class="balance-title">보유 지머니</span>
            <span class="balance-amount" id="balanceDisplay">₩0</span>
        </div>
        <div class="user-panel">
            <span class="user-name" id="currentUserDisplay">👤 닉네임</span>
            <button class="btn-logout" onclick="giveRelief()">파산 지원금(₩10,000)</button>
            <button class="btn-logout" onclick="logout()">로그아웃</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="leaderboard">
            <h3>🏆 실시간 재산 랭킹</h3>
            <ul class="rank-list" id="rankList">
                <li style="text-align:center; color:var(--text-muted); margin-top:20px;">로딩 중...</li>
            </ul>
        </div>

        <div class="game-area">
            <div class="controls">
                <div class="input-group">
                    <label>베팅 금액</label>
                    <input type="number" id="betInput" min="100" value="1000" step="100">
                </div>
                <div class="input-group">
                    <label>지뢰 개수</label>
                    <select id="minesSelect">
                        <option value="1">1개</option>
                        <option value="3" selected>3개</option>
                        <option value="5">5개</option>
                        <option value="10">10개</option>
                        <option value="20">20개 (극악)</option>
                    </select>
                </div>
                <button class="btn-main" id="actionBtn" onclick="handleActionButton()">게임 시작</button>
            </div>

            <div class="board-container">
                <div class="status-box" id="statusBox">
                    <span class="next-multiplier">준비 완료</span>
                </div>
                <div class="grid" id="grid"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBgyQkeKHWpiTGhH24neivlM3dN674D1kM",
      authDomain: "kee-pit.firebaseapp.com",
      databaseURL: "https://kee-pit-default-rtdb.firebaseio.com",
      projectId: "kee-pit",
      storageBucket: "kee-pit.firebasestorage.app",
      messagingSenderId: "911390417144",
      appId: "1:911390417144:web:7a01697f7528e9c0069b0d",
      measurementId: "G-CVYHFVC5RT"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const FAKE_EMAIL_DOMAIN = "@mines.local";
    const INITIAL_BALANCE = 10000;
    const GRID_SIZE = 25;

    let currentUser = null;   // username (표시용)
    let currentUid = null;    // firebase auth uid (DB 키로 사용)
    let balance = 0;
    let authMode = 'login';

    let state = {
        isPlaying: false, betAmount: 0, mineCount: 3,
        mines: [], revealed: [], currentMultiplier: 1.0, gameOver: false
    };

    const UI = {
        balanceDisplay: document.getElementById('balanceDisplay'),
        betInput: document.getElementById('betInput'),
        minesSelect: document.getElementById('minesSelect'),
        actionBtn: document.getElementById('actionBtn'),
        statusBox: document.getElementById('statusBox'),
        gridEl: document.getElementById('grid'),
        rankList: document.getElementById('rankList'),
        authError: document.getElementById('authError'),
        authSubmitBtn: document.getElementById('authSubmitBtn'),
        tabLogin: document.getElementById('tabLogin'),
        tabSignup: document.getElementById('tabSignup')
    };

    // ==========================================
    // 0. 아이디 검증 유틸
    // ==========================================
    function isValidUsername(name) {
        return /^[a-zA-Z0-9_]{3,15}$/.test(name);
    }
    function usernameToEmail(name) {
        return name.toLowerCase() + FAKE_EMAIL_DOMAIN;
    }

    // ==========================================
    // 1. 인증(로그인/회원가입) 로직
    // ==========================================
    window.switchTab = function(mode) {
        authMode = mode;
        UI.authError.innerText = '';
        if (mode === 'login') {
            UI.tabLogin.classList.add('active');
            UI.tabSignup.classList.remove('active');
            UI.authSubmitBtn.innerText = '로그인';
        } else {
            UI.tabSignup.classList.add('active');
            UI.tabLogin.classList.remove('active');
            UI.authSubmitBtn.innerText = '회원가입';
        }
    };

    window.handleAuthSubmit = async function() {
        const username = document.getElementById('authUsername').value.trim();
        const password = document.getElementById('authPassword').value;
        UI.authError.innerText = '';

        if (!isValidUsername(username)) {
            UI.authError.innerText = '아이디는 영문/숫자/밑줄 3~15자여야 합니다.';
            return;
        }
        if (!password || password.length < 6) {
            UI.authError.innerText = '비밀번호는 6자 이상이어야 합니다.';
            return;
        }

        UI.authSubmitBtn.disabled = true;
        const email = usernameToEmail(username);

        try {
            if (authMode === 'signup') {
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                await db.ref('users/' + cred.user.uid).set({
                    username: username,
                    balance: INITIAL_BALANCE
                });
            } else {
                await auth.signInWithEmailAndPassword(email, password);
            }
            // 성공 시 onAuthStateChanged가 나머지 처리를 담당
        } catch (error) {
            UI.authError.innerText = mapAuthError(error.code);
        } finally {
            UI.authSubmitBtn.disabled = false;
        }
    };

    function mapAuthError(code) {
        switch (code) {
            case 'auth/email-already-in-use': return '이미 존재하는 아이디입니다.';
            case 'auth/invalid-credential':
            case 'auth/wrong-password': return '아이디 또는 비밀번호가 틀렸습니다.';
            case 'auth/user-not-found': return '존재하지 않는 아이디입니다.';
            case 'auth/weak-password': return '비밀번호가 너무 약합니다 (6자 이상).';
            case 'auth/too-many-requests': return '시도가 너무 많습니다. 잠시 후 다시 시도하세요.';
            default: return '오류가 발생했습니다: ' + code;
        }
    }

    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUid = user.uid;
            try {
                const snapshot = await db.ref('users/' + currentUid).get();
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    currentUser = data.username;
                    balance = data.balance;
                } else {
                    currentUser = user.email.replace(FAKE_EMAIL_DOMAIN, '');
                    balance = INITIAL_BALANCE;
                    await db.ref('users/' + currentUid).set({ username: currentUser, balance });
                }
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('gameContainer').style.display = 'flex';
                document.getElementById('currentUserDisplay').innerText = `👤 ${currentUser}`;
                updateUI();
                renderBoard();
                startLeaderboardSync();
            } catch (error) {
                console.error("Firebase DB Error:", error);
                alert("데이터베이스 연결에 실패했습니다. Realtime Database 규칙을 확인하세요.");
            }
        } else {
            currentUid = null; currentUser = null;
            document.getElementById('authModal').classList.remove('hidden');
            document.getElementById('gameContainer').style.display = 'none';
        }
    });

    window.logout = function() {
        if (state.isPlaying) return alert('진행중인 게임이 있습니다. 인출하거나 게임을 끝낸 후 로그아웃하세요.');
        auth.signOut();
        document.getElementById('authUsername').value = '';
        document.getElementById('authPassword').value = '';
    };

    window.giveRelief = async function() {
        if (state.isPlaying) return alert('게임 진행 중에는 받을 수 없습니다.');
        if (balance >= 1000) return alert('잔액이 1,000원 미만일 때만 지원받을 수 있습니다.');
        balance = INITIAL_BALANCE;
        await syncBalanceToDB();
        updateUI();
    };

    async function syncBalanceToDB() {
        if (!currentUid) return;
        await db.ref('users/' + currentUid).update({ balance: balance });
    }

    function startLeaderboardSync() {
        db.ref('users').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const userArray = Object.keys(data).map(uid => ({
                uid, name: data[uid].username, balance: data[uid].balance
            })).sort((a, b) => b.balance - a.balance);

            UI.rankList.innerHTML = '';
            userArray.forEach((user, index) => {
                const li = document.createElement('li');
                li.className = `rank-item ${user.uid === currentUid ? 'me' : ''}`;
                let rankIcon = `${index + 1}위`;
                if (index === 0) rankIcon = '🥇';
                if (index === 1) rankIcon = '🥈';
                if (index === 2) rankIcon = '🥉';
                li.innerHTML = `
                    <span class="rank-name">${rankIcon} ${user.name}</span>
                    <span class="rank-money">₩${user.balance.toLocaleString()}</span>
                `;
                UI.rankList.appendChild(li);
            });
        });
    }

    // ==========================================
    // 2. 게임 메커니즘 로직
    // ==========================================
    function combination(n, k) {
        if (k < 0 || k > n) return 0;
        if (k === 0 || k === n) return 1;
        let res = 1; for (let i = 1; i <= k; i++) res = res * (n - i + 1) / i; return res;
    }

    function calculateMultiplier(gemsRevealed, totalMines) {
        if (gemsRevealed === 0) return 1.0;
        const prob = combination(GRID_SIZE - totalMines, gemsRevealed) / combination(GRID_SIZE, gemsRevealed);
        return Math.max(1.01, Math.floor(((1 / prob) * 0.97) * 100) / 100);
    }

    window.handleActionButton = function() { state.isPlaying ? cashout() : startGame(); };

    async function startGame() {
        const bet = parseInt(UI.betInput.value);
        const mineCount = parseInt(UI.minesSelect.value);

        if (isNaN(bet) || bet <= 0) return alert('올바른 금액을 입력하세요.');
        if (bet > balance) return alert('지머니가 부족합니다!');

        const mines = [];
        while (mines.length < mineCount) {
            const rand = Math.floor(Math.random() * GRID_SIZE);
            if (!mines.includes(rand)) mines.push(rand);
        }

        balance -= bet;
        await syncBalanceToDB();

        state = { ...state, betAmount: bet, mineCount, mines, revealed: [], currentMultiplier: 1.0, isPlaying: true, gameOver: false };
        updateUI(); renderBoard();
    }

    window.handleTileClick = async function(index) {
        if (!state.isPlaying || state.revealed.includes(index)) return;
        state.revealed.push(index);

        if (state.mines.includes(index)) {
            state.isPlaying = false; state.gameOver = true;
            UI.statusBox.innerHTML = `<span class="message lose">💥 ₩${state.betAmount.toLocaleString()} 잃음!</span>`;
        } else {
            state.currentMultiplier = calculateMultiplier(state.revealed.length, state.mineCount);
            if (state.revealed.length === GRID_SIZE - state.mineCount) {
                await cashout();
                return;
            }
        }
        updateUI(); renderBoard();
    };

    async function cashout() {
        if (!state.isPlaying) return;
        const winAmount = Math.floor(state.betAmount * state.currentMultiplier);
        balance += winAmount;
        await syncBalanceToDB();
        state.isPlaying = false;
        UI.statusBox.innerHTML = `<span class="message win">🎉 ₩${winAmount.toLocaleString()} 획득!</span>`;
        updateUI(); renderBoard();
    }

    // ==========================================
    // 3. UI 렌더링 로직
    // ==========================================
    function updateUI() {
        UI.balanceDisplay.innerText = `₩${balance.toLocaleString()}`;
        if (state.isPlaying) {
            UI.betInput.disabled = true; UI.minesSelect.disabled = true;
            const currentWin = Math.floor(state.betAmount * state.currentMultiplier);
            UI.actionBtn.innerText = `인출하기 (₩${currentWin.toLocaleString()})`;
            const nextMult = calculateMultiplier(state.revealed.length + 1, state.mineCount);
            UI.statusBox.innerHTML = `<div class="multiplier">${state.currentMultiplier.toFixed(2)}x</div><div class="next-multiplier">다음 보석: ${nextMult.toFixed(2)}x</div>`;
        } else {
            UI.betInput.disabled = false; UI.minesSelect.disabled = false;
            UI.actionBtn.innerText = '게임 시작';
            if (!state.gameOver && state.revealed.length === 0) UI.statusBox.innerHTML = `<span class="next-multiplier">준비 완료</span>`;
        }
    }

    function renderBoard() {
        UI.gridEl.innerHTML = '';
        for (let i = 0; i < GRID_SIZE; i++) {
            const tile = document.createElement('div');
            tile.classList.add('tile');
            const isRevealed = state.revealed.includes(i);
            const isMine = state.mines.includes(i);

            if (!state.isPlaying && !state.gameOver) { /* 빈칸 */ }
            else if (isRevealed) {
                tile.classList.add('revealed');
                if (isMine) { tile.classList.add('mine'); tile.innerText = '💣'; }
                else { tile.classList.add('gem'); tile.innerText = '💎'; }
            } else if (state.gameOver) {
                tile.classList.add('revealed');
                if (isMine) { tile.classList.add('mine'); tile.innerText = '💣'; }
                else { tile.style.opacity = '0.3'; }
            }
            tile.addEventListener('click', () => window.handleTileClick(i));
            UI.gridEl.appendChild(tile);
        }
    }

    renderBoard();
</script>
</body>
</html>
